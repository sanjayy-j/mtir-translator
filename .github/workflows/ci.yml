name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# The implementation is C++17 and nothing else.  There is no Python job: the
# prototype it used to run against has been migrated in full and removed from
# the repository.  See docs/migration.md.

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # LLVM gives llvm-as; WABT gives wat2wasm and wasm-validate.  Both are
      # optional: CMake registers the corresponding tests as skipped when the
      # tool is missing, so the Windows job still builds and runs everything
      # that does not need them.
      - name: Install LLVM and WABT
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm wabt

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # Runs, in one go:
      #   - the C++ unit tests
      #   - the two golden-file checks through mtirc
      #   - llvm-as over the generated LLVM IR
      #   - wat2wasm and wasm-validate over the generated WebAssembly
      #   - every corpus program executed on the reference stack VM, with its
      #     output compared against what the source says it should print
      #
      # The two external-tool checks report SKIPPED rather than passing when
      # the tool is absent, so a run that validated nothing cannot be mistaken
      # for one that did.
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  validate-examples:
    name: Validate the hand-written target files
    runs-on: ubuntu-latest

    # These are the reference artefacts in docs/examples, written by hand to
    # show what each back end is aiming at.  They are checked separately from
    # the generated ones so that a regression in the compiler and a mistake in
    # the documentation cannot be confused for one another.
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and WABT
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm wabt

      - name: llvm-as accepts docs/examples/abs.ll
        run: llvm-as docs/examples/abs.ll -o /tmp/abs.bc

      - name: wat2wasm accepts docs/examples/abs.wat
        run: wat2wasm docs/examples/abs.wat -o /tmp/abs.wasm

      - name: Module validates
        run: wasm-validate /tmp/abs.wasm
