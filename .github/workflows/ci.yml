name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------
  # The C++17 implementation.  This is the job that matters: C++ is the
  # project's implementation language, and the Python job below runs only
  # while the prototype is still the reference for the parts of the
  # pipeline that have not been migrated yet (front end, semantic
  # analysis, WebAssembly and stack back ends).
  # ---------------------------------------------------------------------
  cpp:
    name: Build and test the C++ implementation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm

      - name: Configure
        # No -DMTIR_WERROR=ON yet: the code has been compiled clean with
        # MSVC at /W4 but has not been built with GCC, so the first CI run
        # is expected to surface warnings that nobody has triaged.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # Runs the unit tests, the two golden-file checks through mtirc, and
      # llvm-as over the generated IR.  The llvm-as test reports SKIPPED
      # rather than passing when the tool is absent, so a run that validated
      # nothing cannot be mistaken for one that did.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  test:
    name: Python reference implementation (retired at migration phase K)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: python -m pip install -r requirements.txt

      # The same script every member runs locally, so local and CI
      # environments cannot silently diverge.
      - name: Verify environment
        run: bash scripts/setup.sh

      - name: Run tests
        run: python -m pytest -q --cov=src --cov-report=term-missing

      # Golden-file check: the CIR printer must stay byte-identical to the
      # worked example in the Review 1 report.
      - name: CIR printer golden file
        run: python -m src.driver --demo-cir | diff - docs/examples/abs.cir

  validate-examples:
    name: Validate hand-written target files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and WABT
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm wabt

      - name: llvm-as accepts docs/examples/abs.ll
        run: llvm-as docs/examples/abs.ll -o /tmp/abs.bc

      - name: wat2wasm accepts docs/examples/abs.wat
        run: wat2wasm docs/examples/abs.wat -o /tmp/abs.wasm

      - name: Module validates
        run: wasm-validate /tmp/abs.wasm
