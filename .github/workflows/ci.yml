name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------
  # The C++17 implementation.  This is the job that matters: C++ is the
  # project's implementation language, and the Python job below runs only
  # while the prototype is still the reference for the parts of the
  # pipeline that have not been migrated yet (front end, semantic
  # analysis, WebAssembly and stack back ends).
  # ---------------------------------------------------------------------
  cpp:
    name: Build and test the C++ implementation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm

      - name: Configure
        # No -DMTIR_WERROR=ON yet: the code has been compiled clean with
        # MSVC at /W4 but has not been built with GCC, so the first CI run
        # is expected to surface warnings that nobody has triaged.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # Runs the unit tests, the two golden-file checks through mtirc, and
      # llvm-as over the generated IR.  The llvm-as test reports SKIPPED
      # rather than passing when the tool is absent, so a run that validated
      # nothing cannot be mistaken for one that did.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  test:
    name: Python implementation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: python -m pip install -r requirements.txt

      # The same script every member runs locally, so local and CI
      # environments cannot silently diverge.
      - name: Verify environment
        run: bash scripts/setup.sh

      - name: Run tests
        run: python -m pytest -q --cov=src --cov-report=term-missing

      # Golden-file check: the CIR printer must stay byte-identical to the
      # worked example in the Review 1 report.
      - name: CIR printer golden file
        run: python -m src.driver --demo-cir | diff - docs/examples/abs.cir

  # Objective O4: the fixed corpus plus 500 generated programs must agree on
  # all four targets.  This runs on x86, where inf - inf is a negative NaN;
  # the 507/507 figure was first measured on ARM, where it is positive.
  differential:
    name: Four-way differential (500 seeds)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        opt: [0, 1]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install clang and dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          python -m pip install -r requirements.txt

      # The harness skips a target whose tool is missing and still exits 0,
      # so a run that compared fewer than four targets is failed explicitly.
      - name: Run the harness
        run: |
          set -o pipefail
          python -m tests.harness.differential --random 500 --opt ${{ matrix.opt }} | tee differential.log
          if grep -q '^skipped' differential.log; then
            echo "::error::a target was skipped, so this run is not a four-way comparison"
            exit 1
          fi

  # The team demos on Windows, where the LLVM runner needs a .exe, links
  # printf through legacy_stdio_definitions.lib and sees a trap as an
  # NTSTATUS code instead of a signal.  The runner image ships clang and the
  # MSVC linker, so this is a real four-way run on Windows.
  windows:
    name: Python on Windows (four-way)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run the harness
        shell: bash
        run: |
          set -o pipefail
          clang --version
          python -m tests.harness.differential --random 100 | tee differential.log
          if grep -q '^skipped' differential.log; then
            echo "::error::a target was skipped, so this run is not a four-way comparison"
            exit 1
          fi

  validate-examples:
    name: Validate hand-written target files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and WABT
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm wabt

      - name: llvm-as accepts docs/examples/abs.ll
        run: llvm-as docs/examples/abs.ll -o /tmp/abs.bc

      - name: wat2wasm accepts docs/examples/abs.wat
        run: wat2wasm docs/examples/abs.wat -o /tmp/abs.wasm

      - name: Module validates
        run: wasm-validate /tmp/abs.wasm
